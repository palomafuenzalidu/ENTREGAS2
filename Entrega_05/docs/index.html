<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Wilkinson Dot Plot - Nominaciones Streaming</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
</head>
<body>
  <h2>Visualización de nominaciones del streaming</h2>
  <label for="plataforma">Filtrar por plataforma:</label>
  <select id="plataforma">
    <option value="Todas">Todas</option>
  </select>

  <div id="plot" style="margin-top:20px;"></div>

  <script>
    let allData = [];

    Papa.parse('oscars_distribuidoras_FINAL', {
      download: true,
      header: true,
      complete: function(results) {
        allData = results.data;

        // Llenar el select de plataformas
        const plataformas = [...new Set(allData.map(d => d.Platform).filter(Boolean))];
        const select = document.getElementById('plataforma');
        plataformas.forEach(p => {
          const option = document.createElement('option');
          option.value = p;
          option.textContent = p;
          select.appendChild(option);
        });

        // Dibujar inicialmente con todas
        drawPlot('Todas');

        // Agregar evento de filtro
        select.addEventListener('change', e => {
          drawPlot(e.target.value);
        });
      }
    });

    function drawPlot(filtro) {
      const filtrado = filtro === 'Todas' ? allData : allData.filter(d => d.Platform === filtro);

      const ganadoras = filtrado.filter(d => d.Won === "1");
      const nominadas = filtrado.filter(d => d.Won !== "1");

      const traceGanadoras = {
        x: ganadoras.map((_, i) => i + 1),
        y: ganadoras.map(d => d.Title),
        mode: 'markers',
        type: 'scatter',
        name: 'Ganadora',
        marker: { color: 'gold', size: 12 },
        text: ganadoras.map(d => d.Title),
        hoverinfo: 'text'
      };

      const traceNominadas = {
        x: nominadas.map((_, i) => i + 1),
        y: nominadas.map(d => d.Title),
        mode: 'markers',
        type: 'scatter',
        name: 'Solo nominada',
        marker: { color: 'gray', size: 10 },
        text: nominadas.map(d => d.Title),
        hoverinfo: 'text'
      };

      const layout = {
        title: `Películas nominadas (${filtro})`,
        xaxis: { visible: false },
        yaxis: {
          title: '',
          showticklabels: false
        },
        showlegend: true,
        height: 500
      };

      Plotly.newPlot('plot', [traceGanadoras, traceNominadas], layout);
    }
  </script>
</body>
</html>
